# 创业板 ETF 温度交易系统参数
# 说明：
# 1. 使用 market_thermo.py 导出的“市场温度时间序列.csv”
# 2. 交易标的默认使用创业板 ETF 159915.SZ
# 3. 比较两套策略：
#    - value_only：纯价值驱动，信号出现后直接满仓
#    - value_managed：价值驱动 + 综合温度做仓位管理

[data]
temperature_csv = "outputs/市场温度时间序列.csv"
etf_code = "159915.SZ"
start_date = "20170101"
end_date = ""
initial_capital = 1000000

[trade]
buy_cost_rate = 0.0003
sell_cost_rate = 0.0003
slippage_rate = 0.0002
lot_size = 100

[trend_filter]
short_ma_window = 20
long_ma_window = 60

[strategy.value_only]
entry_anchor = 30.0
deep_anchor = 24.0
exit_anchor = 55.0
stop_loss = -0.10
cooldown_days = 15
max_holding_days = 120
initial_weight = 0.25
deep_weight = 0.50
heavy_weight = 1.00

[strategy.value_managed]
entry_anchor = 30.0
deep_anchor = 24.0
exit_anchor = 55.0
stop_loss = -0.10
cooldown_days = 15
max_holding_days = 120
initial_weak_weight = 0.25
initial_normal_weight = 0.50
deep_weight = 0.75
heavy_weight = 1.0
confirm_composite_low = 35.0
confirm_rebound_days = 5

[plot]
benchmark_name = "创业板ETF买入持有"
